spring:
  data:
    redis:
      host: localhost
      port: 6379
  application:
    name: secondhandBookstore
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://localhost:3306/secondhand_bookstore?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
app:
  name: secondhandBookstore
  version: "0.0.1"
  jwt:
    secret: ${JWT_SECRET}
    issuer: secondhand-bookstore
    expiration: 2h
  client-ip:
    trust-forwarded-headers: false
mybatis-plus:
  global-config:
    db-config:
      id-type: auto
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n"
#  level:
#    org.springframework.security: DEBUG