spring:
  application:
    name: secondhandBookstore
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://localhost:3306/secondhand_bookstore?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
app:
  name: secondhandBookstore
  version: "0.0.1"
mybatis-plus:
  global-config:
    db-config:
      id-type: auto